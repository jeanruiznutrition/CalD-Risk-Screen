<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalD Risk Screen - Plataforma Científica de Jean Carlos Ruiz Mosley</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome for medical/nutritional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <div id="root"></div>

    <!-- Datos y constantes (JS plano, sin JSX) -->
    <script src="js/data.js?v=2.7"></script>
    <!-- Archivos de idioma (uno por idioma, JS plano) -->
    <script src="js/i18n/es.js?v=2.7"></script>
    <script src="js/i18n/en.js?v=2.7"></script>
    <script src="js/i18n/pt.js?v=2.7"></script>
    <!-- Registro de idiomas: ensambla los anteriores y publica los completos -->
    <script src="js/i18n.js?v=2.7"></script>
    <!-- Motor de cálculo CalD Risk Estimation Algorithm (JS plano, sin JSX) -->
    <script src="js/algorithm.js?v=2.7"></script>
    <!-- Interfaz React (requiere compilación JSX en el navegador) -->
    <script type="text/babel" src="js/app.js?v=2.7"></script>

</body>
</html>
