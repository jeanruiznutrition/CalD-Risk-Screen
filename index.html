    <!-- ============================================================
         RED DE SEGURIDAD DE ARRANQUE (nuevo en la v6.0)
         ============================================================
         Antes de la v6.0, cualquier fallo de carga —un archivo de js/ que
         no llegara al servidor, un bloqueo de los CDN por cortafuegos—
         dejaba la pantalla gris sin ningún mensaje, y el README tenía que
         explicar cómo abrir la consola del navegador. En una entrevista
         delante del participante eso significa perder la sesión.

         El límite de error de React (LimiteDeError, en ui-panels.js)
         captura los fallos DURANTE el render. Este bloque captura los que
         ocurren ANTES de que React monte, que son los más graves porque
         no hay nada en pantalla que los muestre. -->
    <script>
        (function () {
            var mostrado = false;
            function mostrarFalloDeArranque(titulo, detalle) {
                if (mostrado) return;
                mostrado = true;
                var raiz = document.getElementById('root');
                if (!raiz) return;
                raiz.innerHTML =
                    '<div style="max-width:700px;margin:48px auto;padding:24px;border:1px solid #fda4af;' +
                    'border-radius:16px;background:#fff;font-family:system-ui,-apple-system,sans-serif">' +
                    '<h1 style="font-size:17px;color:#be123c;margin:0 0 8px">' + titulo + '</h1>' +
                    '<p style="font-size:13px;color:#334155;line-height:1.6;margin:0 0 16px">' +
                    'La aplicación no llegó a arrancar. Lo más habitual es que uno de los archivos ' +
                    'de la carpeta <code>js/</code> no llegara al navegador, o que la red bloquee los ' +
                    'servicios externos de los que depende la interfaz.</p>' +
                    '<pre style="background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;' +
                    'font-size:11px;white-space:pre-wrap;overflow:auto;max-height:280px">' +
                    String(detalle).replace(/[&<>]/g, function (c) {
                        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
                    }) + '</pre></div>';
            }

            window.addEventListener('error', function (ev) {
                // Un archivo de script que no carga genera un evento de error
                // sobre el propio elemento, sin objeto Error asociado.
                if (ev.target && ev.target.tagName === 'SCRIPT') {
                    mostrarFalloDeArranque('No se pudo cargar un archivo necesario',
                        'Archivo: ' + (ev.target.src || '(desconocido)'));
                    return;
                }
                if (ev.error) {
                    mostrarFalloDeArranque('Error al iniciar la aplicación',
                        (ev.error.name || 'Error') + ': ' + (ev.error.message || '') + '\n\n' +
                        (ev.error.stack || '') + '\n\nOrigen: ' + (ev.filename || '') + ':' + (ev.lineno || ''));
                }
            }, true);

            window.addEventListener('unhandledrejection', function (ev) {
                mostrarFalloDeArranque('Error al iniciar la aplicación',
                    'Promesa rechazada sin manejar: ' + String(ev.reason && (ev.reason.stack || ev.reason.message || ev.reason)));
            });

            // Si a los 8 segundos React no ha montado nada, algo falló en
            // silencio (típicamente Babel bloqueado por la red).
            window.addEventListener('load', function () {
                setTimeout(function () {
                    var raiz = document.getElementById('root');
                    if (raiz && raiz.children.length === 0) {
                        mostrarFalloDeArranque('La interfaz no terminó de cargar',
                            'React no montó ningún componente en 8 segundos.\n' +
                            'Comprobaciones: React ' + (typeof React !== 'undefined' ? 'OK' : 'NO CARGÓ') +
                            ' · Babel ' + (typeof Babel !== 'undefined' ? 'OK' : 'NO CARGÓ') +
                            ' · datos ' + (typeof CARDA_VERSION !== 'undefined' ? 'OK' : 'NO CARGARON') +
                            ' · traducciones ' + (typeof TRANSLATIONS !== 'undefined' ? 'OK' : 'NO CARGARON'));
                    }
                }, 8000);
            });
        })();
    </script>
