<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="description" content="CalD Risk Screen — tamizaje determinístico de riesgo de calcio, vitamina D, óseo y sarcopenia.">
    <title>CalD Risk Screen - Plataforma Científica de Jean Carlos Ruiz Mosley</title>

    <!-- Favicon: hueso minimalista sobre lienzo redondeado, en el tono de acento de la app -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF9500'/%3E%3Cpath d='M32 42c-5 0-9-4-9-9s4-9 9-9 8 3 9 7h18c1-4 4-7 9-7s9 4 9 9-4 9-9 9c-2 0-4-1-6-2-1 3-1 7 0 10 2-1 4-2 6-2 5 0 9 4 9 9s-4 9-9 9-8-3-9-7H41c-1 4-4 7-9 7s-9-4-9-9 4-9 9-9c2 0 4 1 6 2 1-3 1-7 0-10-2 1-4 2-6 2z' fill='white'/%3E%3C/svg%3E">

    <!-- Tailwind CSS CDN — paleta recalibrada a los colores de sistema de Apple (Human Interface
         Guidelines: System Colors + System Gray Palette, iOS/iPadOS 18 y macOS Sequoia). Al
         redefinir aquí los mismos nombres de color que ya usa app.js (slate, blue, rose, amber,
         emerald, teal, brand) toda la interfaz se retiñe de punta a punta sin tocar una sola
         línea de marcado ni de lógica: las 85 pruebas de validacion.js y humo.js no se ven
         afectadas. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        /* Acento de marca — System Orange de Apple. Sustituye al ámbar
                           genérico anterior por el naranja oficial de iOS/macOS. */
                        brand: {
                            50: '#FFF4E8',
                            100: '#FFE7D1',
                            200: '#FFCA9E',
                            300: '#FFAD6B',
                            400: '#FF9F0A',
                            500: '#FF9500',
                            600: '#E68600',
                            700: '#BF6F00',
                            800: '#8C5200',
                            900: '#4D2D00',
                            950: '#2E1B00',
                        },
                        /* Gris neutro de sistema (System Gray 1–6 + Label colors) en vez del
                           slate por defecto de Tailwind, que tiene un matiz azulado ajeno a
                           Apple. Escala monótona clara→oscura, igual que el slate original,
                           así que ningún par light/dark: se rompe. */
                        slate: {
                            50: '#F5F5F7',
                            100: '#F2F2F7',
                            200: '#E5E5EA',
                            300: '#D1D1D6',
                            400: '#AEAEB2',
                            500: '#8E8E93',
                            600: '#6E6E73',
                            700: '#48484A',
                            800: '#363638',
                            900: '#1C1C1E',
                            950: '#000000',
                        },
                        /* System Blue — banda informativa */
                        blue: {
                            50: '#EAF2FF', 100: '#D6E7FF', 200: '#ADCEFF', 300: '#7FB2FF',
                            400: '#3D8BFF', 500: '#0A84FF', 600: '#007AFF', 700: '#0060CC',
                            800: '#004999', 900: '#00306B', 950: '#001B3D',
                        },
                        /* System Red — riesgo alto */
                        rose: {
                            50: '#FFEDEC', 100: '#FFDAD8', 200: '#FFB5B0', 300: '#FF8983',
                            400: '#FF5b53', 500: '#FF453A', 600: '#FF3B30', 700: '#D70015',
                            800: '#A30011', 900: '#66000A', 950: '#3D0006',
                        },
                        /* System Yellow/Orange claro — riesgo moderado y avisos */
                        amber: {
                            50: '#FFFAE5', 100: '#FFF3C4', 200: '#FFE788', 300: '#FFDA4D',
                            400: '#FFD60A', 500: '#FFCC00', 600: '#E6B800', 700: '#B38F00',
                            800: '#806600', 900: '#4D3D00', 950: '#2E2400',
                        },
                        /* System Green — riesgo bajo / éxito */
                        emerald: {
                            50: '#E9FBEF', 100: '#CFF7DC', 200: '#9FEFBA', 300: '#68E092',
                            400: '#30D158', 500: '#34C759', 600: '#1DA64A', 700: '#12793A',
                            800: '#0E5C2C', 900: '#0F3B19', 950: '#08210E',
                        },
                        /* System Teal — usos puntuales de apoyo */
                        teal: {
                            50: '#E6FAFC', 100: '#C8F2F7', 200: '#94E4EE', 300: '#5AC8E0',
                            400: '#40C8E0', 500: '#30B0C7', 600: '#0B9DB3', 700: '#087C8C',
                            800: '#0B5C68', 900: '#0D2F34', 950: '#071A1D',
                        },
                        /* System Indigo — insignias de sección (identidad/registro) */
                        indigo: {
                            50: '#EEEDFC', 100: '#DEDCFA', 200: '#BCB9F4', 300: '#9B96EF',
                            400: '#7A73E9', 500: '#5E5CE6', 600: '#5856D6', 700: '#413FB0',
                            800: '#2E2C85', 900: '#1D1B57', 950: '#100F33',
                        },
                        /* System Purple — insignias de sección */
                        purple: {
                            50: '#F8ECFC', 100: '#F0D9F9', 200: '#E1B3F3', 300: '#D28DEC',
                            400: '#C36DE3', 500: '#BF5AF2', 600: '#AF52DE', 700: '#8A3FB3',
                            800: '#652E85', 900: '#421D58', 950: '#271033',
                        },
                        /* System Pink — insignias de sección */
                        pink: {
                            50: '#FFECF0', 100: '#FFD6DF', 200: '#FFADBE', 300: '#FF849E',
                            400: '#FF5C81', 500: '#FF375F', 600: '#FF2D55', 700: '#D30F3B',
                            800: '#9E0B2C', 900: '#69071D', 950: '#3D0410',
                        },
                        /* System Cyan — insignias de sección */
                        cyan: {
                            50: '#E6F7FE', 100: '#CCEEFD', 200: '#99DDFB', 300: '#66CDFA',
                            400: '#64D2FF', 500: '#32ADE6', 600: '#0A96D6', 700: '#0876A8',
                            800: '#075B80', 900: '#073D56', 950: '#04222F',
                        },
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome for medical/nutritional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css?v=3.1">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <div id="root"></div>

    <!-- Datos y constantes (JS plano, sin JSX) -->
    <script src="js/data.js?v=3.1"></script>
    <!-- Archivos de idioma (uno por idioma, JS plano) -->
    <script src="js/i18n/es.js?v=3.1"></script>
    <script src="js/i18n/en.js?v=3.1"></script>
    <script src="js/i18n/pt.js?v=3.1"></script>
    <!-- Registro de idiomas: ensambla los anteriores y publica los completos -->
    <script src="js/i18n.js?v=3.1"></script>
    <!-- Motor de cálculo CalD Risk Estimation Algorithm (JS plano, sin JSX) -->
    <script src="js/algorithm.js?v=3.1"></script>
    <!-- Interfaz React (requiere compilación JSX en el navegador) -->
    <script type="text/babel" src="js/app.js?v=3.1"></script>

</body>
</html>
